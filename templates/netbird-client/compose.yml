services:
  netbird-client:
    image: netbirdio/netbird:latest
    container_name: netbird-client-${NB_HOSTNAME:?required}
    hostname: ${NB_HOSTNAME:?required}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      # Required when using userspace mode or when kernel module is not available
      - /dev/net/tun
    network_mode: host
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY:?required}
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL:-https://api.netbird.io:443}
    volumes:
      - netbird-client:/var/lib/netbird
volumes:
  netbird-client:
